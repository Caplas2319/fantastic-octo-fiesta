<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>对话</title>
<style>
:root{--bg:#f5f6f4;--sf:#fff;--ink:#1d2326;--mu:#6a7479;--ln:#dde1e0;--ac:#2f6f68;--on:#fff;--me:#2f6f68;--meT:#fff;--ub:#e7edeb;--fs:16px;--ok:#2e9e6b;--warn:#d99a21}
@media(prefers-color-scheme:dark){:root{--bg:#121618;--sf:#1b2124;--ink:#e6ebea;--mu:#8a9697;--ln:#2a3235;--ac:#5fb3a8;--on:#0d1514;--me:#2c5c56;--meT:#e6ebea;--ub:#222b2e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;max-width:820px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;border-bottom:1px solid var(--ln)}
header h1{flex:1;margin:0 4px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.ic:hover{background:var(--ln)}
.ic.off{color:var(--mu);opacity:.6}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#dot{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:1.5px solid var(--bg)}
#dot.ok{background:var(--ok)}
#notice{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--ln);font-size:14px;color:var(--mu)}
#notice span{flex:1}
#notice button{padding:4px 12px;border-radius:8px;background:var(--ac);color:var(--on);font-size:14px}
[hidden]{display:none!important}
main{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--mu);font-size:15px}
.m{padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.m.user{background:var(--ub);color:var(--ink)}
.m.assistant{padding:2px 2px}
.m,.ed,#input{font-size:var(--fs)}
.fp{font-size:var(--fs);padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin-bottom:12px;color:var(--ink)}
footer{padding:6px 10px max(8px,env(safe-area-inset-bottom))}
.box{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:6px 6px 2px 12px}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:120px;padding:2px 0;line-height:1.45}
.tools{display:flex;justify-content:space-between;align-items:center}
.tl{display:flex;align-items:center;flex:1;min-width:0}
.tools .ic{width:34px;height:34px;flex:none}
.tools .ic svg{width:20px;height:20px}
#send{background:var(--ac);color:var(--on);border-radius:50%}
#send:hover{background:var(--ac);filter:brightness(1.08)}
#sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px max(12px,env(safe-area-inset-bottom))}
.panel{width:100%;max-width:820px;background:var(--sf);border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.panel h2{margin:0 0 4px;font-size:17px}
.panel p{margin:0 0 12px;font-size:14px;color:var(--mu)}
.panel .row{display:flex;flex-wrap:wrap;gap:8px}
.panel .row button{flex:1 1 40%;padding:11px 8px;border:1px solid var(--ln);border-radius:12px}
.panel .row button:hover{background:var(--ln)}
.panel .row button.main{background:var(--ac);color:var(--on);border-color:var(--ac)}
#tk{position:absolute;left:12px;bottom:calc(100% + 3px);padding:1px 8px;border-radius:10px;font-size:11px;line-height:16px;color:var(--mu);background:var(--sf);border:1px solid var(--ln);opacity:.85;pointer-events:none}
#dn{position:absolute;right:14px;top:-46px;width:36px;height:36px;border-radius:50%;background:var(--sf);border:1px solid var(--ln);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.m.md{white-space:normal}
.md p{margin:.55em 0}.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.8em 0 .4em;line-height:1.3}
.md h1{font-size:1.3em}.md h2{font-size:1.2em}.md h3{font-size:1.1em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.4em 0;padding-left:1.4em}.md li{margin:.15em 0}
.md blockquote{margin:.5em 0;padding:.1em 0 .1em .8em;border-left:3px solid var(--ln);color:var(--mu)}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:0 4px}
.md pre{margin:.5em 0;padding:10px 12px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;white-space:pre;word-break:normal}
.md hr{border:0;border-top:1px solid var(--ln);margin:.8em 0}
.md a{color:var(--ac)}
.md .tw{overflow-x:auto;margin:.5em 0}.md table{border-collapse:collapse;font-size:.95em}.md th,.md td{border:1px solid var(--ln);padding:5px 9px}.md th{background:var(--bg)}
.pend{display:flex;gap:8px;flex-wrap:wrap;padding:4px 6px 6px 0}
.pa{position:relative;width:56px;height:56px;border-radius:10px;border:1px solid var(--ln);overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--mu);text-align:center;cursor:pointer}
.pa img{width:100%;height:100%;object-fit:cover}
.pa.f{width:auto;max-width:150px;height:40px;padding:0 24px 0 10px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;display:block;line-height:38px}
.pa .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:20px;text-align:center}
.pa.b::after{content:'识别中';position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:11px}
.atl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;margin-bottom:4px}
.atl .pa{width:76px;height:76px}.atl .pa.f{width:auto;height:40px}
#viewer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;overflow-y:auto}
#viewer img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:8px}
#viewer textarea{width:100%;max-width:640px;height:22vh;max-height:none;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit}
#viewer .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#viewer .tb{background:var(--sf);color:var(--ink)}
#viewer .tb.main{background:var(--ac);color:var(--on)}
.st{font-size:12px;color:var(--mu);margin:0 4px 3px}
.ml{margin:-4px 0 12px;max-height:40vh;overflow-y:auto;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.ml button{display:block;width:100%;text-align:left;padding:10px 12px;word-break:break-all;color:var(--ink)}
.ml button:hover{background:var(--ln)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
.r{display:flex;flex-direction:column;width:100%;align-items:stretch}
.r .m{max-width:100%}
.r.editing{width:100%;max-width:100%;align-items:stretch}
.r .ed{border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:9px 12px;max-height:50vh;overflow-y:auto}
.acts{display:flex;gap:2px;margin-top:2px;align-items:center}
.acts .ic{width:32px;height:32px;color:var(--mu)}
.acts .ic svg{width:17px;height:17px}
.acts .tb{margin:4px 6px 0 0}
.tb{padding:5px 14px;border-radius:8px;border:1px solid var(--ln)}
.tb.main{background:var(--ac);color:var(--on);border-color:var(--ac)}
footer{position:relative;z-index:4}
#pickBg{position:fixed;inset:0;z-index:3}
#pick{position:absolute;left:12px;right:12px;bottom:100%;max-height:50vh;overflow-y:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.pi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:11px 12px;border-radius:10px;text-align:left;word-break:break-all}
.pi:hover{background:var(--ln)}
.pi small{color:var(--mu);font-size:13px;white-space:nowrap}
.pn{padding:10px 12px;color:var(--mu);font-size:14px;display:flex;gap:8px}
.pn input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.selw{display:flex;align-items:center;min-width:0}
#selLabel{padding:6px 4px;text-align:left;font-size:13px;color:var(--mu);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{position:fixed;inset:0;z-index:6;background:var(--bg);overflow-y:auto}
.screen .in{max-width:820px;margin:0 auto}
.bar{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px;border-bottom:1px solid var(--ln)}
.bar h2{margin:0 4px;font-size:17px}
.body{padding:14px 16px 40px}
.body h3{margin:0 0 8px;font-size:15px;color:var(--mu);font-weight:600}
.hint{color:var(--mu);font-size:14px;margin:0 0 8px}
.wide{width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;margin:8px 0}
.wide.main{background:var(--ac);color:var(--on);border-color:var(--ac)}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0}
.fld{display:block;margin-bottom:12px;font-size:14px;color:var(--mu)}
.fld input,.fld select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit}
.fld textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit;max-height:50vh;resize:vertical}
.qb{border:1px solid var(--ln);border-radius:12px;background:var(--sf);margin-bottom:10px}
.qb summary{display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;list-style:none}
.qb summary::-webkit-details-marker{display:none}
.qb .t{font-weight:600}
.qb .n{flex:1;color:var(--mu);font-size:14px}
.qb input{width:22px;height:22px}
.qb.off .t,.qb.off .n,.qb.off .qc{opacity:.5}
.qb .qc{padding:0 12px 12px;max-height:45vh;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-size:15px}
.qm{margin-bottom:8px}
.qm b{color:var(--ac);margin-right:6px}
.tabs{display:flex;gap:6px;padding:8px 12px 0;border-bottom:1px solid var(--ln)}
.tab{padding:8px 14px;color:var(--mu)}
.tab.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px var(--ac)}
.mi{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);margin-bottom:8px;padding:4px 12px 4px 0}
.mi.off{opacity:.55}
.mi input{width:22px;height:22px}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;text-align:left}
.mt .a{font-weight:600}
.mt .b{color:var(--mu);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#memEd{z-index:7}
#edText,#dText{display:block;width:100%;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;resize:none}
#edText{height:60vh;max-height:none;margin-bottom:8px}
#dText{height:42vh;max-height:none;margin-top:8px}
#sumDlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:11;display:grid;place-items:center;padding:16px}
#sumDlg .card{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--sf);border-radius:16px;padding:16px}
#sumDlg h3{margin:0 0 6px;font-size:17px}
#sumDlg .hint{margin:0}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.sh span{flex:1}
.sh .ic{margin-right:-8px}
#shM .ic{margin:0 4px 0 -8px}
#shM span{text-align:center}
.it{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:10px;cursor:pointer}
.it:hover{background:var(--ln)}
.it.cur{background:var(--bg);font-weight:600}
.it .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mu);font-size:13px;font-weight:400}
.it input{width:20px;height:20px;flex:none}
.grp{font-weight:600}
.chev{width:16px;height:16px;flex:none;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.gc{padding-left:14px}
.hd{width:34px;height:30px;margin:-4px -6px -4px 0;display:grid;place-items:center;touch-action:none;color:var(--mu);cursor:grab}
.hd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.drag{background:var(--ln);opacity:.85}
#toast{z-index:12}
#sideBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:7}
#side{position:fixed;top:0;bottom:0;left:0;width:min(320px,84vw);background:var(--sf);border-right:1px solid var(--ln);transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s;z-index:8;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#side.on{transform:none;visibility:visible}
.sh{height:52px;display:flex;align-items:center;padding:0 16px;font-weight:600;border-bottom:1px solid var(--ln)}
#sideList{flex:1;overflow-y:auto;padding:6px;-webkit-user-select:none;user-select:none}
.si{display:block;width:100%;padding:11px 12px;border-radius:10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si:hover{background:var(--ln)}
.si.cur{background:var(--bg);font-weight:600}
.sb{display:flex;gap:8px;padding:10px 10px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.sb .tb{flex:1;padding:9px 6px}
#popBg{position:fixed;inset:0;z-index:10}
#pop{position:fixed;z-index:11;min-width:140px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ic" id="menuBtn" aria-label="会话菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <h1 id="title">新对话</h1>
    <button class="ic" id="fsBtn" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ic" id="saveBtn" aria-label="存档设置"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><i id="dot"></i></button>
    <button class="ic" id="qBtn" aria-label="发送队列"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4zM9 4v13M15 7v13"/></svg></button>
    <button class="ic" id="newBtn" aria-label="新建对话"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <div id="notice" hidden><span id="noticeText"></span><button id="noticeBtn"></button></div>
  <main id="list"></main>
  <div id="pickBg" hidden></div>
  <footer>
    <div id="pick" hidden></div>
    <button class="ic" id="dn" hidden aria-label="回到底部"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <div class="box">
      <div id="tk" hidden></div>
      <div class="pend" id="pend" hidden></div>
      <textarea id="input" rows="1" placeholder="输入消息"></textarea>
      <div class="tools">
        <div class="tl"><div class="selw"><button class="ic" id="apiBtn" aria-label="选择 API 和模型"><svg viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg></button><button id="selLabel" aria-label="选择模型"></button></div></div>
        <div style="display:flex;align-items:center">
          <button class="ic" id="attBtn" aria-label="添加附件"><svg viewBox="0 0 24 24"><path d="M20 11.5 12 19.5a5 5 0 0 1-7-7L13.5 4a3.4 3.4 0 0 1 5 5L10 17.5a1.8 1.8 0 0 1-2.5-2.5L15 7.5"/></svg></button>
          <button class="ic" id="send" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </div>
    </div>
  </footer>
</div>

<div id="sideBg" hidden></div>
<aside id="side">
  <div class="sh" id="shN"><span>对话</span><button class="ic" id="grpBtn" aria-label="新建小组"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></svg></button></div>
  <div class="sh" id="shM" hidden><button class="ic" id="mX" aria-label="退出多选"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span id="mCnt">已选择 0 项</span><button class="tb" id="mAll">全选</button></div>
  <div class="sh" id="shS" hidden><span>拖动手柄调整顺序</span><button class="tb" id="sDone">完成</button></div>
  <div id="sideList"></div>
  <div class="sb" id="sbN"><button class="tb" id="sSet">总设置</button><button class="tb" id="sWin">当前窗口设置</button></div>
  <div class="sb" id="sbM" hidden><button class="tb" id="mMove">移动</button><button class="tb" id="mDel">删除</button></div>
</aside>
<div id="set" class="screen" hidden><div class="in">
  <div class="bar"><button class="ic" id="setBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="setTitle">总设置</h2></div>
  <div class="body">
    <div id="setMain">
      <h3>API</h3>
      <div id="apiList"></div>
      <button class="wide" id="apiAdd">添加 API</button>
      <label class="sw"><input type="checkbox" id="stream"> 流式输出</label>
      <label class="fld">回复长度上限（Anthropic 格式用，默认 4096）<input id="maxTok" type="number" inputmode="numeric" min="1"></label>
      <label class="fld">消息字号：<span id="fszV"></span>px（只改消息和输入框，不影响菜单）<input id="fsz" type="range" min="13" max="24" step="1"></label>
      <div class="fp">字号预览：这是一段示例文字 The quick brown fox.</div>
    </div>
    <div id="apiForm" hidden>
      <label class="fld">名称<input id="fName" placeholder="例如：我的 Claude"></label>
      <label class="fld">格式<select id="fFmt"><option value="anthropic">Anthropic</option><option value="openai">OpenAI 兼容</option></select></label>
      <label class="fld">接口地址<input id="fUrl" inputmode="url" autocapitalize="off" autocomplete="off"></label>
      <label class="fld">密钥（只保存在本机）<input id="fKey" type="password" autocomplete="off"></label>
      <button class="wide main" id="bSave">保存</button>
      <button class="wide" id="bDel">删除</button>
    </div>
  </div></div></div>
<div id="win" class="screen" hidden><div class="in">
  <div class="bar"><button class="ic" id="winBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>当前窗口设置</h2></div>
  <div class="tabs"><button class="tab on" data-t="base">基础设置</button><button class="tab" data-t="mem">记忆</button></div>
  <div class="body">
    <div id="winBase">
      <label class="fld">对话名称<input id="wName"></label>
      <label class="fld">提示词<textarea id="wPrompt" rows="6"></textarea></label>

</div></div>

  <div class="bar"><button class="ic" id="qBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>发送队列</h2></div>
  <div class="body">
    <p class="hint">下次发送时会带上的内容，按顺序排列；关掉开关就不发送这一块。你接下来的消息会接在历史后面。</p>

<div id="sheet" hidden>
  <div class="panel">
    <h2>存档</h2>
    <p id="status"></p>
    <div class="row" id="fileRow">
      <button class="main" id="bNew">新建存档文件</button>
      <button id="bOpen">打开存档文件</button>

      <button id="bExport">导出 JSON</button>
      <button id="bImport">导入 JSON</button>

  </div>

<input type="file" id="file" multiple accept="image/*,.txt,.md,.markdown,text/plain,text/markdown" hidden>
<div id="viewer" hidden><img id="vImg" alt=""><textarea id="vTx"></textarea><div class="row"><button class="tb" id="vRe">重新识别</button><button class="tb" id="vDel">删除</button><button class="tb main" id="vClose">关闭</button></div></div>
<script>
const $=s=>document.querySelector(s);
const FS='showSaveFilePicker' in window;
const PICK={types:[{description:'JSON',accept:{'application/json':['.json']}}]};
let state,handle=null,granted=false,timer=null,lastSaved=0;

/* IndexedDB: 工作副本和文件句柄 */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('chatfront',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kvGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kvSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

/* 数据 */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function fresh(){const id=uid();return{v:1,updatedAt:Date.now(),currentId:id,sessions:[{id,title:'新对话',messages:[]}]}}
const valid=d=>d&&Array.isArray(d.sessions)&&d.sessions.length&&d.currentId&&typeof d.updatedAt==='number';
const cur=()=>sc(state.sessions.find(s=>s.id===state.currentId)||state.sessions[0]);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* 保存 */
function touch(){state.updatedAt=Date.now();kvSet('state',state);clearTimeout(timer);timer=setTimeout(writeFile,1000);setStatus()}
async function writeFile(){
  clearTimeout(timer);
  if(!handle||!granted)return;
  try{const w=await handle.createWritable();await w.write(JSON.stringify(state));await w.close();lastSaved=Date.now()}
  catch(e){granted=false;toast('写入存档失败，请重新授权')}
  setStatus();
}
async function checkPerm(){
  if(!handle)return;
  try{granted=(await handle.queryPermission({mode:'readwrite'}))==='granted'}catch(e){granted=false}
}
async function syncFromFile(){
  try{
    const t=await(await handle.getFile()).text();
    if(t.trim()){
      const d=JSON.parse(t);
      if(valid(d)&&d.updatedAt>state.updatedAt){state=d;await kvSet('state',state);render();toast('已读取存档');setStatus();return}
    }
  }catch(e){toast('存档文件读取失败')}
  await writeFile();
}
async function authorize(){
  if(!handle)return;
  try{granted=(await handle.requestPermission({mode:'readwrite'}))==='granted'}catch(e){granted=false}
  if(granted){$('#sheet').hidden=true;await syncFromFile()}else toast('未获得授权');
  setStatus();
}
async function newFile(){
  try{
    handle=await showSaveFilePicker({suggestedName:'chat-data.json',...PICK});
    granted=true;await kvSet('handle',handle);await writeFile();toast('已创建存档文件');$('#sheet').hidden=true;
  }catch(e){if(e.name!=='AbortError')toast('创建失败：'+e.message)}
  setStatus();
}
async function openFile(){
  try{
    [handle]=await showOpenFilePicker(PICK);
    await kvSet('handle',handle);await authorize();
  }catch(e){if(e.name!=='AbortError')toast('打开失败：'+e.message)}
  setStatus();
}
function exportJSON(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));
  a.download='chat-data-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function importJSON(file){
  try{
    const d=JSON.parse(await file.text());
    if(!valid(d))throw 0;
    if(!confirm('导入会替换当前所有对话，继续吗？'))return;
    state=d;touch();render();toast('已导入');
  }catch(e){toast('文件格式不对，无法导入')}
}

/* 状态显示 */
function setStatus(){
  const hm=lastSaved?new Date(lastSaved).toTimeString().slice(0,5):'';
  let s,n=null;
  if(!FS)s='此浏览器不支持文件存档，数据只保存在浏览器内，请定期导出 JSON。';
  else if(!handle){s='还没有存档文件，数据暂存在浏览器内。';n=['还没有存档文件','设置','sheet']}
  else if(!granted){s='存档文件已连接，需要授权后才会自动保存。';n=['需要授权才能自动保存','授权','auth']}
  else s='已连接存档文件，自动保存'+(hm?'，上次保存 '+hm:'')+'。';
  $('#status').textContent=s;
  $('#dot').classList.toggle('ok',FS&&granted);
  $('#bNew').hidden=$('#bOpen').hidden=!FS;
  $('#bAuth').hidden=!(FS&&handle&&!granted);
  $('#notice').hidden=!n;
  if(n){$('#noticeText').textContent=n[0];$('#noticeBtn').textContent=n[1];$('#noticeBtn').dataset.act=n[2]}
}

/* 界面 */
let editing=null;
function ib(label,path,fn){const b=document.createElement('button');b.className='ic';b.title=label;b.setAttribute('aria-label',label);b.innerHTML='<svg viewBox="0 0 24 24"><path d="'+path+'"/></svg>';b.onclick=fn;return b}
function tb(label,fn,main){const b=document.createElement('button');b.className='tb'+(main?' main':'');b.textContent=label;b.onclick=fn;return b}
function render(keep){
  loadDraft();updTok();
  const s=cur(),l=$('#list'),y=l.scrollTop;
  $('#title').textContent=s.title;document.title=s.title;
  l.textContent='';
  if(!s.messages.length){const e=document.createElement('div');e.className='empty';e.textContent='还没有消息。发送后会自动存档。';l.append(e);return}
  for(const m of s.messages){
    const r=document.createElement('div');r.className='r '+m.role;
    if(m.id===editing){
      r.classList.add('editing');
      const ta=document.createElement('textarea');ta.className='ed';ta.value=m.content;
      const fitEd=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};
      ta.oninput=fitEd;
      const a=document.createElement('div');a.className='acts';
      a.append(tb('保存',()=>saveEdit(m,ta.value),true),tb('取消',()=>{editing=null;render(true)}));
      r.append(ta,a);l.append(r);
      requestAnimationFrame(()=>{fitEd();ta.focus()});
      continue;
    }
    const d=document.createElement('div');d.className='m '+m.role;if(m.role==='assistant'){d.classList.add('md');if(m.content)d.innerHTML=md(m.content);else d.textContent='…'}else d.textContent=m.content;
    if(m.role==='assistant'&&m.sec!=null){const t=document.createElement('div');t.className='st';t.textContent='用时 '+m.sec+'s';r.append(t)}
    if(m.role==='user'&&m.atts&&m.atts.length){const w=document.createElement('div');w.className='atl';m.atts.forEach(a=>w.append(attEl(a,m.atts,false,()=>{touch();render(true)})));r.append(w)}
    if(!(m.role==='user'&&!m.content&&m.atts&&m.atts.length))r.append(d);
    if(!ctrl&&txt(m)){
      const a=document.createElement('div');a.className='acts';
      a.append(ib('重新生成','M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6',()=>m.role==='assistant'?regen(m):regenUser(m)));
      a.append(ib('复制','M9 9h10v11H9zM5 15V4h10',()=>copyMsg(m)));
      a.append(ib('编辑','M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',()=>{editing=m.id;render(true)}));
      a.append(ib('删除','M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6',()=>delMsg(m)));
      r.append(a);
    }
    l.append(r);
  }
  l.scrollTop=keep?y:l.scrollHeight;syncDn();
}
/* ===== 附件 ===== */
const imgCache={},descBusy=new Set();let pend=[];
const DEF_VIS='请详细描述这张图片的内容，包括其中的文字、人物、场景和细节。';
const visCfg=c=>{const a=apis().find(x=>x.id===c.visApi);return a&&c.visModel?{api:a,model:c.visModel}:null};
const wTok=c=>typeof c==='string'?estTok(c):c.reduce((n,p)=>n+(p.t==='img'?1000:estTok(p.text)),0);
async function procImage(f){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const cv=(max,q)=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
    return{data:cv(1280,.82),thumb:cv(256,.7)};
  }finally{URL.revokeObjectURL(url)}
}
async function describe(a,c){
  const v=visCfg(c);if(!v||!imgCache[a.id])return;
  descBusy.add(a.id);a.desc='';if(pend.includes(a))renderPend();
  try{await chat(v.api,v.model,[{role:'user',content:[{t:'img',data:imgCache[a.id]},{t:'text',text:DEF_VIS}]}],new AbortController().signal,x=>{a.desc+=x},'')}
  catch(e){toast(e.message)}
  descBusy.delete(a.id);a.desc=a.desc.trim();
  if(pend.includes(a))renderPend();else touch();
}
async function addFiles(files){
  const c=cur();
  for(const f of files){
    if(pend.length>=8){toast('一次最多 8 个附件');break}
    try{
      if(f.type.startsWith('image/')){
        const r=await procImage(f),a={id:uid(),type:'img',name:f.name||'图片',thumb:r.thumb,desc:''};
        imgCache[a.id]=r.data;pend.push(a);renderPend();
        if(visCfg(c))describe(a,c);
      }else if(/\.(txt|md|markdown)$/i.test(f.name)||f.type.startsWith('text/')){
        let t=await f.text();if(t.length>200000){t=t.slice(0,200000);toast('文件过长，只取前 20 万字')}
        pend.push({id:uid(),type:'text',name:f.name,text:t});renderPend();
      }else toast('不支持的文件：'+f.name+'（支持图片、txt、md）');
    }catch(e){toast('读取失败：'+f.name)}
  }
}
function dropAtt(a,list,after){const i=list.indexOf(a);if(i>=0)list.splice(i,1);delete imgCache[a.id];after()}
function attEl(a,list,x,after){
  const e=document.createElement('div');e.className='pa'+(a.type==='text'?' f':'')+(descBusy.has(a.id)?' b':'');
  if(a.type==='img'){const i=document.createElement('img');i.src=a.thumb;i.alt=a.name;e.append(i)}else e.textContent=a.name;
  e.onclick=()=>openViewer(a,list,after);
  if(x){const b=document.createElement('span');b.className='x';b.textContent='×';b.onclick=ev=>{ev.stopPropagation();dropAtt(a,list,after)};e.append(b)}
  return e;
}
function renderPend(){
  const p=$('#pend');p.textContent='';p.hidden=!pend.length;
  pend.forEach(a=>p.append(attEl(a,pend,true,renderPend)));updTok();
}
let vCur=null;
function openViewer(a,list,after){
  vCur={a,list,after};const img=a.type==='img';
  $('#vImg').hidden=!img;if(img)$('#vImg').src=imgCache[a.id]||a.thumb;
  const t=$('#vTx');t.value=img?(a.desc||''):a.text;t.readOnly=!img;
  t.placeholder=img?'文字描述（可编辑；用文字代替图片发送时会用到）':'';
  $('#vRe').hidden=!(img&&visCfg(cur())&&imgCache[a.id]);
  $('#viewer').hidden=false;
}
function closeViewer(){$('#viewer').hidden=true;if(vCur){const v=vCur;vCur=null;v.after()}}
$('#vTx').oninput=e=>{if(vCur&&vCur.a.type==='img'){vCur.a.desc=e.target.value;if(vCur.list!==pend)touch()}};
$('#vClose').onclick=closeViewer;
$('#viewer').onclick=e=>{if(e.target.id==='viewer')closeViewer()};
$('#vDel').onclick=()=>{const v=vCur;vCur=null;$('#viewer').hidden=true;if(v)dropAtt(v.a,v.list,v.after)};
$('#vRe').onclick=async()=>{const v=vCur;if(!v)return;$('#vRe').disabled=true;await describe(v.a,cur());if(vCur===v)$('#vTx').value=v.a.desc;$('#vRe').disabled=false};
$('#attBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const fs=[...e.target.files];e.target.value='';addFiles(fs)};
/* ===== Markdown ===== */
const escH=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inl(t){
  const codes=[];
  t=escH(t).replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0001'});
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g,'<b>$1</b>')
    .replace(/__(?=\S)([\s\S]*?\S)__/g,'<b>$1</b>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g,'<s>$1</s>')
    .replace(/\*(?=\S)([^*\n]*?\S)\*/g,'<i>$1</i>')
    .replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1<i>$2</i>');
  return t.replace(/\u0000(\d+)\u0001/g,(_,i)=>'<code>'+codes[i]+'</code>');
}
const MD_ITEM=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/,MD_HR=/^\s*([-*_])(\s*\1){2,}\s*$/,MD_SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const mdCells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
function md(src){
  const L=src.replace(/\r/g,'').split('\n'),out=[];let i=0;
  const tblAt=k=>k+1<L.length&&L[k].includes('|')&&MD_SEP.test(L[k+1])&&L[k+1].includes('-');
  const blk=k=>/^\s*```/.test(L[k])||/^#{1,6}\s/.test(L[k])||/^\s*>/.test(L[k])||MD_ITEM.test(L[k])||MD_HR.test(L[k])||tblAt(k);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(/^\s*```/.test(l)){
      const buf=[];i++;
      while(i<L.length&&!/^\s*```/.test(L[i]))buf.push(L[i++]);
      i++;out.push('<pre><code>'+escH(buf.join('\n'))+'</code></pre>');continue;
    }
    let m=l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(m){out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');i++;continue}
    if(MD_HR.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*>/.test(l)){
      const buf=[];
      while(i<L.length&&/^\s*>/.test(L[i]))buf.push(L[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');continue;
    }
    if(tblAt(i)){
      const hd=mdCells(l);i+=2;
      let h='<div class="tw"><table><thead><tr>'+hd.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>';
      while(i<L.length&&L[i].trim()&&L[i].includes('|'))h+='<tr>'+mdCells(L[i++]).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>';
      out.push(h+'</tbody></table></div>');continue;
    }
    if(MD_ITEM.test(l)){
      const st=[];let h='';
      while(i<L.length){
        m=L[i].match(MD_ITEM);
        if(m){
          const n=m[1].replace(/\t/g,'    ').length,t=/\d/.test(m[2])?'ol':'ul',num=parseInt(m[2],10);
          while(st.length&&n<st[st.length-1].n)h+='</li></'+st.pop().t+'>';
          const top=st[st.length-1];
          if(!top||n>top.n){st.push({n,t});h+='<'+t+(t==='ol'&&num!==1?' start="'+num+'"':'')+'>'}else if(top.t!==t){h+='</li></'+top.t+'><'+t+(t==='ol'&&num!==1?' start="'+num+'"':'')+'>';top.t=t}else h+='</li>';
          h+='<li>'+inl(m[3]);i++;
        }else if(/^\s{2,}\S/.test(L[i])&&!blk(i)){h+='<br>'+inl(L[i].trim());i++}
        else if(!L[i].trim()){let k=i;while(k<L.length&&!L[k].trim())k++;if(k<L.length&&MD_ITEM.test(L[k]))i=k;else break}
        else break;
      }
      while(st.length)h+='</li></'+st.pop().t+'>';
      out.push(h);continue;
    }
    const buf=[l];i++;
    while(i<L.length&&L[i].trim()&&!blk(i))buf.push(L[i++]);
    out.push('<p>'+buf.map(inl).join('<br>')+'</p>');
  }
  return out.join('');
}
function copyMsg(m){
  const ok=()=>toast('已复制');
  const fb=()=>{const t=document.createElement('textarea');t.value=m.content;t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('复制失败')}t.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(m.content).then(ok,fb);else fb();
}
let follow=true;
const nearBot=()=>{const l=$('#list');return l.scrollHeight-l.scrollTop-l.clientHeight<80};
function syncDn(){$('#dn').hidden=nearBot()}
$('#list').addEventListener('scroll',()=>{follow=nearBot();syncDn()});
$('#dn').onclick=()=>{const l=$('#list');l.scrollTo({top:l.scrollHeight,behavior:'smooth'});follow=true};
const estTok=t=>{let c=0;for(const ch of t)if(ch.charCodeAt(0)>0x2e7f)c++;return c+Math.ceil((t.length-c)/4)};
function updTok(){

async function fetchModels(a){
  const an=a.fmt==='anthropic';let r;
  try{r=await fetch(an?anURL(a,'models?limit=1000'):root(a)+'/models',{headers:headersOf(a)})}catch(e){throw new Error(NETERR)}
  if(!r.ok)throw new Error('获取模型失败 '+r.status);
  const j=await r.json();return(j.data||[]).map(m=>m.id).filter(Boolean);
}
async function sse(r,fn){
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){
    const{done,value}=await rd.read();if(done)break;
    buf+=dc.decode(value,{stream:true});
    let k;
    while((k=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,k).replace(/\r$/,'');buf=buf.slice(k+1);
      if(!line.startsWith('data:'))continue;
      const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
      let j;try{j=JSON.parse(d)}catch(e){continue}
      fn(j);
    }
  }
}
async function chat(a,model,msgs,signal,onTx,system){
  const an=a.fmt==='anthropic',stream=getStream();
  const url=an?anURL(a,'messages'):root(a)+'/chat/completions';
  const wire=m=>typeof m.content==='string'?m:{role:m.role,content:m.content.map(p=>p.t==='img'?(an?{type:'image',source:{type:'base64',media_type:'image/jpeg',data:p.data.split(',')[1]}}:{type:'image_url',image_url:{url:p.data}}):{type:'text',text:p.text})};
  const ms=msgs.map(wire);
  const body=an?{model,max_tokens:getMax(),messages:ms,stream}:{model,messages:system?[{role:'system',content:system},...ms]:ms,stream};
  if(an&&system)body.system=system;
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...headersOf(a)},body:JSON.stringify(body),signal})}
  catch(e){if(e.name==='AbortError')throw e;throw new Error(NETERR)}
  if(!r.ok)throw new Error('请求失败 '+r.status+'：'+(await r.text()).slice(0,150));
  if(stream){
    await sse(r,j=>{
      if(an){
        if(j.type==='content_block_delta'&&j.delta&&j.delta.text)onTx(j.delta.text);
        else if(j.type==='error')throw new Error((j.error&&j.error.message)||'接口返回错误');
      }else{const t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(t)onTx(t)}
    });
  }else{
    const j=await r.json();
    onTx(an?(j.content||[]).map(c=>c.text||'').join(''):((j.choices&&j.choices[0]&&j.choices[0].message.content)||''));
  }
}
const attTxt=(m,sk)=>(m.atts||[]).filter(a=>a.type==='text'||!(sk&&sk.has(a.id))).map(a=>a.type==='text'?'【文件：'+a.name+'】\n'+a.text:'【图片：'+a.name+'】'+(a.desc||'（无文字描述）'));
const txt=(m,sk)=>[m.content,...attTxt(m,sk)].filter(Boolean).join('\n\n');
let natId=null;
function historyOf(arr){
  const out=[];
  for(const m of arr){
    const imgs=m.id===natId?(m.atts||[]).filter(a=>a.type==='img'&&imgCache[a.id]):[];
    const t=txt(m,new Set(imgs.map(a=>a.id)));
    if(!t&&!imgs.length)continue;
    const parts=imgs.length?[...imgs.map(a=>({t:'img',data:imgCache[a.id]})),...(t?[{t:'text',text:t}]:[])]:null;
    const l=out[out.length-1];
    if(l&&l.role===m.role){
      if(!parts&&typeof l.content==='string')l.content+='\n\n'+t;
      else{const lp=typeof l.content==='string'?[{t:'text',text:l.content}]:l.content;l.content=[...lp,...(parts||[{t:'text',text:t}])]}
    }else out.push({role:m.role,content:parts||t});
  }
  return out;
}

async function run(api,model,s,old){
  const a={id:uid(),role:'assistant',content:'',ts:Date.now()};
  s.messages.push(a);ctrl=new AbortController();busy(true);touch();render();
  const lu=[...s.messages].reverse().find(m=>m.role==='user'&&m!==a);
  natId=visCfg(s)?null:(lu&&lu.id);
  const el=$('#list').lastChild.querySelector('.m'),{system,msgs}=plan(s,a);natId=null;
  let ok=false;follow=true,raf=0;
  const paint=()=>{raf=0;el.innerHTML=md(a.content);if(follow){const l=$('#list');l.scrollTop=l.scrollHeight}};
  const t0=Date.now(),st=document.createElement('div');st.className='st';el.parentNode.insertBefore(st,el);
  const tick=()=>{st.textContent=(a.content?'输出中 ':'等待回复 ')+Math.floor((Date.now()-t0)/1000)+'s'};tick();const iv=setInterval(tick,1000);
  try{await chat(api,model,msgs,ctrl.signal,x=>{a.content+=x;if(!raf)raf=requestAnimationFrame(paint)},system);ok=true}
  catch(e){if(e.name!=='AbortError')toast(e.message)}

  ctrl=null;busy(false);
  if(!a.content){s.messages.splice(s.messages.indexOf(a),1);if(old)s.messages.push(...old)}

function sc(c){if(!c.q)c.q={p:true,m:true,h:true};if(!c.memories)c.memories=[];if(c.prompt==null)c.prompt='';if(c.keep==null)c.keep=0;return c}

function histSlice(list,n){
  if(!n)return list;let k=0;
  for(let i=list.length-1;i>=0;i--)if(list[i].role==='user'&&++k===n)return list.slice(i);
  return list;
}
function plan(c,skip){
  const q=c.q,all=c.messages.filter(m=>m!==skip&&txt(m));

  const ta=$('#dText');ta.value='';ta.readOnly=true;
  dlgCtrl=new AbortController();
  dShow('正在总结…','',[tb('停止',()=>dlgCtrl&&dlgCtrl.abort())],true);
  let err='';
  try{await chat(sel.api,sel.model,[{role:'user',content:text}],dlgCtrl.signal,x=>{ta.value+=x;ta.scrollTop=ta.scrollHeight},(c.sumPrompt||'').trim()||DEF_SUM)}
  catch(e){if(e.name!=='AbortError')err=e.message}
  dlgCtrl=null;ta.readOnly=false;
  if(err)dShow('总结失败',err,[tb('重试',()=>runSum(c),true),tb('放弃',dClose)],false);
  else if(!ta.value.trim())dShow('已停止','',[tb('重新总结',()=>runSum(c),true),tb('放弃',dClose)],false);
  else dShow('总结完成，可以修改','',[tb('确认保存',()=>saveSum(c),true),tb('重新生成',()=>runSum(c)),tb('放弃',dClose)],true);
}
function saveSum(c){
  const t=$('#dText').value.trim();if(!t){toast('总结不能为空');return}
  c.sumN=(c.sumN||0)+1;
  const last=rangeMsgs(c).reduce((a,m)=>Math.max(a,m.ts),c.sumTs||0);
  c.memories.push({id:uid(),title:'总结'+c.sumN,text:t,on:true});
  c.sumTs=last;c.snooze=0;touch();dClose();renderMem();toast('已保存为「总结'+c.sumN+'」');
}
$('#wName').oninput=e=>{const v=e.target.value.trim();if(!v)return;cur().title=v;touch();render(true)};
$('#wName').onchange=e=>{if(!e.target.value.trim())e.target.value=cur().title};
$('#wPrompt').oninput=e=>{cur().prompt=e.target.value;touch()};
$('#wKeep').oninput=e=>{const n=parseInt(e.target.value,10);cur().keep=n>0?n:0;touch()};
$('#winBack').onclick=()=>{$('#win').hidden=true;updTok()};

function openQueue(){
  const c=cur(),l=$('#qList');l.textContent='';
  const all=c.messages.filter(m=>txt(m)),hist=historyOf(histSlice(all,c.keep||0));
  const mem=memText(c),pr=c.prompt.trim();
  const size={p:pr.length,m:mem.length,h:hist.reduce((n,m)=>n+m.content.length,0)};
  const total=()=>{$('#qTotal').textContent='合计约 '+['p','m','h'].reduce((n,k)=>n+(c.q[k]?size[k]:0),0)+' 字（不含你的下一条消息）'};
  const block=(k,title,info,fill)=>{
    const d=document.createElement('details');d.className='qb'+(c.q[k]?'':' off');
    const sm=document.createElement('summary');
    const t=document.createElement('span');t.className='t';t.textContent=title;
    const n=document.createElement('span');n.className='n';n.textContent=info;
    const x=document.createElement('input');x.type='checkbox';x.checked=c.q[k];x.setAttribute('aria-label','发送'+title);
    x.onchange=()=>{c.q[k]=x.checked;d.classList.toggle('off',!x.checked);touch();total()};
    sm.append(t,n,x);
    const b=document.createElement('div');b.className='qc';fill(b);
    d.append(sm,b);l.append(d);
  };
  block('p','提示词',pr?size.p+' 字':'未设置',b=>{b.textContent=pr||'还没有提示词，可在“当前窗口设置”里填写。'});
  const on=c.memories.filter(m=>m.on).length;
  block('m','记忆',mem?on+' 条，'+size.m+' 字':'暂无',b=>{b.textContent=mem||'还没有记忆。'});
  block('h','历史记录',hist.length+' 条消息，'+size.h+' 字',b=>{
    if(!hist.length){b.textContent='还没有历史。';return}
    for(const m of hist){const r=document.createElement('div');r.className='qm';const w=document.createElement('b');w.textContent=m.role==='user'?'你':'AI';r.append(w,m.content);b.append(r)}
  });
  total();$('#queue').hidden=false;
}
$('#qBtn').onclick=openQueue;
$('#qBack').onclick=()=>{$('#queue').hidden=true;updTok()};

/* ===== 会话 ===== */
function openSide(){renderSide();$('#side').classList.add('on');$('#sideBg').hidden=false}
function closeSide(){$('#side').classList.remove('on');$('#sideBg').hidden=true;closePop();mode=null;msel.clear()}
function closePop(){document.querySelectorAll('#pop,#popBg').forEach(e=>e.remove())}
function popMenu(anchor,items){
  closePop();
  const bg=document.createElement('div');bg.id='popBg';bg.onclick=closePop;
  const m=document.createElement('div');m.id='pop';
  items.forEach(([t,fn])=>{const b=document.createElement('button');b.className='pi';b.textContent=t;b.onclick=()=>{closePop();fn()};m.append(b)});
  document.body.append(bg,m);
  const r=anchor.getBoundingClientRect(),h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(r.left+12,innerWidth-m.offsetWidth-8))+'px';
  m.style.top=(r.top>h+8?r.top-h-4:r.bottom+4)+'px';
}
function longPress(el,fn){
  let t=null,x=0,y=0,fired=false;
  const stop=()=>clearTimeout(t);
  el.addEventListener('pointerdown',e=>{fired=false;x=e.clientX;y=e.clientY;t=setTimeout(()=>{fired=true;fn(e)},450)});
  el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-x)>8||Math.abs(e.clientY-y)>8)stop()});
  el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',e=>{if(fired){e.stopImmediatePropagation();e.preventDefault();fired=false}},true);
}
let mode=null;const msel=new Set();
const CHEV='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const HANDLE='<svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg>';
const allIds=()=>[...(state.groups||[]).map(g=>g.id),...state.sessions.map(c=>c.id)];
const allSel=()=>{const a=allIds();return a.length>0&&a.every(id=>msel.has(id))};
function mkRow(kind,o,title,count){
  const r=document.createElement('div');
  r.className='it'+(kind==='g'?' grp':'')+(kind==='s'&&o.id===state.currentId?' cur':'');
  if(mode==='multi'){const x=document.createElement('input');x.type='checkbox';x.checked=msel.has(o.id);x.tabIndex=-1;x.style.pointerEvents='none';r.append(x)}
  if(kind==='g'){
    r.insertAdjacentHTML('beforeend',CHEV);const ch=r.lastElementChild;ch.classList.toggle('open',!!o.open);
    ch.onclick=e=>{if(mode==='multi'){e.stopPropagation();o.open=!o.open;touch();renderSide()}};
  }
  const t=document.createElement('span');t.className='tt';t.textContent=title;r.append(t);
  if(kind==='g'){const n=document.createElement('small');n.textContent=count;r.append(n)}
  if(mode==='sort'){const h=document.createElement('span');h.className='hd';h.innerHTML=HANDLE;r.append(h)}
  r.onclick=()=>{
    if(mode==='sort')return;
    if(mode==='multi'){toggleSel(o.id);return}
    if(kind==='s')switchTo(o.id);else{o.open=!o.open;touch();renderSide()}
  };
  return r;
}
function renderSide(){
  state.groups=state.groups||[];
  const L=$('#sideList'),y=L.scrollTop;L.textContent='';
  $('#shN').hidden=mode!==null;$('#shM').hidden=mode!=='multi';$('#shS').hidden=mode!=='sort';
  $('#sbN').hidden=mode==='multi';$('#sbM').hidden=mode!=='multi';
  const sessOf=g=>state.sessions.filter(c=>(c.group||null)===g);
  const addSess=(par,c)=>{
    const r=mkRow('s',c,c.title);r.dataset.id=c.id;
    if(mode===null)longPress(r,()=>popMenu(r,[['多选',()=>startMulti(c.id)],['重命名',()=>renameChat(c)],['排序',()=>{mode='sort';renderSide()}],['复制',()=>copyChat(c)],['移动到',()=>popMenu(r,folderItems([c.id]))],['删除',()=>deleteChat(c)]]));
    if(mode==='sort')dragSort(r.querySelector('.hd'),r);
    par.append(r);
  };
  const gl=document.createElement('div');gl.id='gList';
  for(const g of state.groups){
    const gb=document.createElement('div');gb.className='gb';gb.dataset.id=g.id;
    const kids=sessOf(g.id),r=mkRow('g',g,g.name,kids.length);
    if(mode===null)longPress(r,()=>popMenu(r,[['多选',()=>startMulti(g.id)],['重命名',()=>renameGroup(g)]]));
    if(mode==='sort')dragSort(r.querySelector('.hd'),gb);
    gb.append(r);
    if(g.open){const gc=document.createElement('div');gc.className='gc';gc.dataset.gid=g.id;kids.forEach(c=>addSess(gc,c));gb.append(gc)}
    gl.append(gb);
  }
  const ul=document.createElement('div');ul.id='uList';ul.dataset.gid='';
  sessOf(null).forEach(c=>addSess(ul,c));
  L.append(gl,ul);L.scrollTop=y;
  if(mode==='multi'){$('#mCnt').textContent='已选择 '+msel.size+' 项';$('#mAll').textContent=allSel()?'取消全选':'全选'}
}
function toggleSel(id){if(msel.has(id))msel.delete(id);else msel.add(id);renderSide()}
function startMulti(id){mode='multi';msel.clear();if(id)msel.add(id);renderSide()}
function exitMode(){mode=null;msel.clear();renderSide()}
function dragSort(handle,item){
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault();handle.setPointerCapture(e.pointerId);item.classList.add('drag');
    const par=item.parentElement;
    const move=ev=>{
      for(const sb of par.children){
        if(sb===item)continue;
        const r=sb.getBoundingClientRect();
        if(ev.clientY<r.top||ev.clientY>r.bottom)continue;
        const after=item.compareDocumentPosition(sb)&Node.DOCUMENT_POSITION_FOLLOWING,mid=r.top+r.height/2;
        if(after&&ev.clientY>mid)sb.after(item);else if(!after&&ev.clientY<mid)sb.before(item);
        break;
      }
    };
    const up=()=>{
      handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);
      item.classList.remove('drag');commitOrder(par);
    };
    handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
  });
}
function commitOrder(par){
  const ids=[...par.children].map(x=>x.dataset.id);
  if(par.id==='gList')state.groups.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  else{
    const mine=ids.map(id=>state.sessions.find(c=>c.id===id)).filter(Boolean);
    state.sessions=[...mine,...state.sessions.filter(c=>!ids.includes(c.id))];
  }
  touch();
}
function folderItems(ids){
  return[['未分组',()=>moveTo(ids,null)],...(state.groups||[]).map(g=>[g.name,()=>moveTo(ids,g.id)])];
}
function moveTo(ids,gid){
  for(const c of state.sessions)if(ids.includes(c.id)){if(gid)c.group=gid;else delete c.group}
  const g=state.groups.find(x=>x.id===gid);if(g)g.open=true;
  touch();if(mode==='multi')exitMode();else renderSide();
  toast('已移动');
}
function copyChat(c){
  if(ctrl){toast(BUSY_MSG);return}
  const n=JSON.parse(JSON.stringify(c));n.id=uid();n.title=c.title+' 副本';
  n.messages.forEach(m=>m.id=uid());(n.memories||[]).forEach(m=>m.id=uid());
  state.sessions.splice(state.sessions.indexOf(c)+1,0,n);touch();renderSide();toast('已复制');
}
function renameGroup(g){
  const v=prompt('重命名',g.name);if(v==null||!v.trim())return;
  g.name=v.trim();touch();renderSide();
}
function deleteSelected(){
  if(ctrl){toast(BUSY_MSG);return}
  const ss=state.sessions.filter(c=>msel.has(c.id)),gs=state.groups.filter(g=>msel.has(g.id));
  if(!ss.length&&!gs.length){toast('请先选择');return}
  const msg=[ss.length?ss.length+' 个对话':'',gs.length?gs.length+' 个小组（组内未选中的对话会移到未分组）':''].filter(Boolean).join('、');
  if(!confirm('删除 '+msg+'？'))return;
  const gid=new Set(gs.map(g=>g.id));
  state.sessions=state.sessions.filter(c=>!msel.has(c.id));
  state.sessions.forEach(c=>{if(gid.has(c.group))delete c.group});
  state.groups=state.groups.filter(g=>!gid.has(g.id));
  if(!state.sessions.length)state.sessions.push({id:uid(),title:'新对话',messages:[]});
  if(!state.sessions.some(c=>c.id===state.currentId)){state.currentId=state.sessions[0].id;editing=null}
  touch();exitMode();render();
}
$('#grpBtn').onclick=()=>{
  const v=prompt('小组名称');if(!v||!v.trim())return;
  state.groups=state.groups||[];state.groups.push({id:uid(),name:v.trim(),open:true});touch();renderSide();
};
$('#mX').onclick=exitMode;$('#sDone').onclick=exitMode;
$('#mAll').onclick=()=>{if(allSel())msel.clear();else allIds().forEach(id=>msel.add(id));renderSide()};
$('#mMove').onclick=()=>{
  const ids=state.sessions.filter(c=>msel.has(c.id)).map(c=>c.id);
  if(!ids.length){toast('请先选择对话');return}
  popMenu($('#mMove'),folderItems(ids));
};
$('#mDel').onclick=deleteSelected;
const BUSY_MSG='正在生成，先停止再操作';
function switchTo(id){if(ctrl){toast(BUSY_MSG);return}state.currentId=id;editing=null;touch();render();closeSide()}
function newChat(){
  if(ctrl){toast(BUSY_MSG);return}
  if(!cur().messages.length){toast('当前已是空白对话');closeSide();return}
  const c={id:uid(),title:'新对话',messages:[]};
  state.sessions.unshift(c);state.currentId=c.id;editing=null;touch();render();closeSide();
}
function renameChat(c){
  const v=prompt('重命名',c.title);if(v==null)return;
  const t=v.trim();if(!t)return;
  c.title=t;touch();render(true);renderSide();
}
function deleteChat(c){
  if(ctrl){toast(BUSY_MSG);return}
  if(!confirm('删除对话「'+c.title+'」？'))return;
  state.sessions=state.sessions.filter(x=>x!==c);
  if(!state.sessions.length)state.sessions.push({id:uid(),title:'新对话',messages:[]});
  if(state.currentId===c.id){state.currentId=state.sessions[0].id;editing=null}
  touch();render();renderSide();
}
$('#menuBtn').onclick=openSide;$('#sideBg').onclick=closeSide;$('#newBtn').onclick=newChat;
$('#sSet').onclick=()=>{closeSide();openSet()};
$('#sWin').onclick=()=>{closeSide();openWin()};
let draftSid=null;
const dKey=id=>'cf_draft_'+id;
function saveDraft(){
  if(!draftSid)return;
  try{const v=$('#input').value;if(v)localStorage.setItem(dKey(draftSid),v);else localStorage.removeItem(dKey(draftSid))}catch(e){}
}
function loadDraft(){
  const id=cur().id;if(id===draftSid)return;
  saveDraft();draftSid=id;
  let v='';try{v=localStorage.getItem(dKey(id))||''}catch(e){}
  $('#input').value=v;fit();
}
function fit(){const i=$('#input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120,innerHeight*.3)+'px';updTok()}

$('#send').onclick=send;
$('#input').oninput=()=>{fit();saveDraft()};
$('#saveBtn').onclick=()=>$('#sheet').hidden=false;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.target.hidden=true};
$('#noticeBtn').onclick=e=>e.target.dataset.act==='auth'?authorize():($('#sheet').hidden=false);
$('#bNew').onclick=newFile;$('#bOpen').onclick=openFile;$('#bAuth').onclick=authorize;
$('#bExport').onclick=exportJSON;
$('#bImport').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importJSON(f)};
document.querySelectorAll('[data-todo]').forEach(b=>b.onclick=()=>toast(b.dataset.todo));
const FS_IN='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT='<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
$('#fsBtn').onclick=()=>{
  if(document.fullscreenElement){document.exitFullscreen();return}
  const e=document.documentElement;
  if(!e.requestFullscreen){toast('这个浏览器不支持全屏');return}
  e.requestFullscreen().catch(()=>toast('全屏被浏览器拦截了'));
};
document.addEventListener('fullscreenchange',()=>{$('#fsBtn').innerHTML=document.fullscreenElement?FS_OUT:FS_IN});
if(window.visualViewport){
  const vv=visualViewport,app=$('#app');
  const fixVV=()=>{
    if(vv.scale<=1.01&&innerHeight-vv.height>1){app.style.height=vv.height+'px';app.style.transform='translateY('+vv.offsetTop+'px)'}
    else{app.style.height='';app.style.transform=''}
  };
  vv.addEventListener('resize',fixVV);vv.addEventListener('scroll',fixVV);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)writeFile()});

/* 启动 */
(async()=>{
  try{state=await kvGet('state');handle=(await kvGet('handle'))||null}catch(e){}
  if(!valid(state))state=fresh();
  try{const ids=new Set(state.sessions.map(x=>x.id));Object.keys(localStorage).filter(k=>k.startsWith('cf_draft_')&&!ids.has(k.slice(9))).forEach(k=>localStorage.removeItem(k))}catch(e){}
  await checkPerm();
  render();setStatus();
  if(handle&&granted)await syncFromFile();
})();
</script>
